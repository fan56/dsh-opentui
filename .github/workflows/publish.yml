name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - run: pnpm install --frozen-lockfile

      # Same stub as ci.yml: no global dsh on runners, only
      # @deepseek-ai/dsh-client-connection is off-registry; tests fake the
      # connection (test/client-fakes.ts) and the stub throws if invoked.
      - name: stub @deepseek-ai/dsh-client-connection (no global dsh on runners)
        run: |
          node -e '
            const { mkdirSync, writeFileSync } = require("node:fs");
            const dir = "packages/shell/node_modules/@deepseek-ai/dsh-client-connection";
            mkdirSync(dir, { recursive: true });
            writeFileSync(dir + "/package.json",
              JSON.stringify({ type: "module", exports: { "./client": "./index.js" } }));
            writeFileSync(dir + "/index.js",
              "export const installConnection = () => { throw new Error(\"CI stub: @deepseek-ai/dsh-client-connection needs a global dsh install\"); };\n");
          '

      # Gate the release on the same checks CI runs per push (ci.yml). bun
      # reads bunfig.toml from the cwd — run the suite per package, not at
      # root. The live E2E scripts self-skip without a global dsh.
      - run: for p in packages/*/; do (cd "$p" && bun test); done
      - run: node packages/shell/scripts/e2e-live.mjs && node packages/shell/scripts/e2e-fork.mjs

      - name: Stamp packages/shell to the tag version
        # The tag is the single source of truth for what gets published (the
        # dsh-mcp-adapter flow). main's package.json may lag behind npm; the
        # stamp keeps publishes tag-accurate and lets small patches skip the
        # version-bump commit (--allow-same-version makes a matching version
        # a no-op). Only @aiwayds/dsh-opentui is public — kit/runtime stay
        # private, so the stamp targets packages/shell only.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/shell
          npm version "${TAG_VERSION}" --no-git-tag-version --allow-same-version
          echo "publishing @aiwayds/dsh-opentui@${TAG_VERSION} (tag ${GITHUB_REF_NAME})"

      - name: Publish
        # npm publish runs prepack (scripts/pack-meta.mjs), which copies the
        # root LICENSE/NOTICE/README.md/CHANGELOG.md into the package. A
        # re-pushed tag (or a publish landing mid-run) can race an
        # already-published version — degrade to a warning, not a failure.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Prerelease tags publish on a side dist-tag — a test version never
          # moves `latest`. Default-deny: any hyphen-suffixed tag is a
          # prerelease. v0.6.0 → latest · v0.6.0-rc.1 → next ·
          # v0.6.0-alpha.1 → alpha. Release policy: main carries no tag by
          # default; a deliberate v* tag is the only path to npm.
          case "$TAG_VERSION" in
            *-alpha.*) NPM_TAG="alpha" ;;
            *-*) NPM_TAG="next" ;;
            *) NPM_TAG="latest" ;;
          esac
          echo "npm dist-tag: ${NPM_TAG}"
          if npm view "@aiwayds/dsh-opentui@${TAG_VERSION}" version >/dev/null 2>&1; then
            echo "::warning::@aiwayds/dsh-opentui@${TAG_VERSION} is already on npm — skipping publish"
            exit 0
          fi
          set +e
          PUB_OUT="$(npm publish --access public --provenance --tag "$NPM_TAG" 2>&1)"
          PUB_RC=$?
          set -e
          printf '%s\n' "$PUB_OUT"
          if [ "${PUB_RC}" -ne 0 ] && printf '%s' "$PUB_OUT" | grep -q "cannot publish over the previously published versions"; then
            echo "::warning::@aiwayds/dsh-opentui@${TAG_VERSION} was published concurrently (or landed mid-publish) — treating as success"
            exit 0
          fi
          exit "${PUB_RC}"
        working-directory: packages/shell
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
