# Release: publish @aiwayds/dsh-opentui to npm and create the matching GitHub
# Release when a v* tag is pushed (workflow_dispatch re-runs an existing tag).
#
# Shape copied from fan56/dsh-cron/.github/workflows/release.yml: named gates
# before the publish, an idempotent publish (an already-published version is a
# clean skip, never a red run), `npm view` as the ONLY accepted proof that a
# publish landed, and the GitHub Release in its own job so it can be re-run
# without re-publishing.
#
# Repo-specific shape (survey: research/upgrade-command-20261116/ci-publish-survey.md):
# - The published package is packages/shell; the root manifest is private and
#   has no version field, so `npm version`/`npm publish` run in packages/shell.
# - prepack runs scripts/build-client.mjs, which imports
#   packages/tui-base/node_modules/@opentui/solid — the FULL workspace install
#   is required (a filtered install leaves that resolution empty), plus bun.
# - `npm publish`, never `pnpm publish`: prepack writes untracked build output
#   (dist/, root metadata copies) and pnpm's git-clean check rejects them.
# - --provenance needs `id-token: write` (below) and packages/shell's
#   `repository` field; without the latter the registry 422s the publish.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to (re)publish, e.g. v0.18.2'
        required: true
        type: string

permissions:
  contents: read

# One run per ref; never cancel a run that may be mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Gate & Publish
    if: github.repository == 'fan56/dsh-opentui' # forks never publish
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 20-min verify window needs headroom above the pre-publish gates
    permissions:
      contents: read
      id-token: write # OIDC claim for npm --provenance (repo is public)
    env:
      # Single source of truth for the version: the pushed tag, or the dispatch
      # input (github.ref_name is the BRANCH for workflow_dispatch, not a tag).
      TAG: ${{ inputs.tag || github.ref_name }}
      PKG: '@aiwayds/dsh-opentui'
      REG: https://registry.npmjs.org
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          # refs/tags/... on a tag push; the dispatch input is normalised to a
          # full ref so checkout never guesses between a branch and a tag.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0 # the main-ancestry check needs real history

      # Tag builds land in a detached HEAD, and parts of the test suite read the
      # current branch name; give the checkout a local branch so those tests see one.
      - name: Materialise a local branch for the tag checkout
        run: git checkout -B ci-release

      - name: Validate the tag
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag '$TAG' must look like v<version>"; exit 1 ;;
          esac
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null \
              || { echo "::error::tag $TAG does not exist on origin"; exit 1; }
          fi

      - name: Tag must point at a commit on main
        # Tag pushes can point at any commit; this gate is what keeps an
        # unreviewed branch off npm. A dispatch re-run checks the same thing.
        run: |
          # Explicit refspec: checkout may fetch only the tag, and this must not
          # depend on the runner's remote-tracking config.
          git fetch --no-tags origin 'main:refs/remotes/origin/main'
          TARGET_SHA="$(git rev-parse HEAD)" # the checked-out tag commit
          if ! git merge-base --is-ancestor "$TARGET_SHA" 'refs/remotes/origin/main'; then
            echo "::error::$TAG ($TARGET_SHA) is not on main — refusing to publish"
            exit 1
          fi
          echo "$TAG -> $TARGET_SHA is an ancestor of origin/main"

      - name: Check provenance prerequisites
        # npm 422s a --provenance publish whose manifest does not point back at
        # this repository; fail here with a named cause instead of a registry
        # error in the middle of the publish.
        run: |
          node -e '
            const pkg = require("./packages/shell/package.json");
            if (!pkg.repository || !pkg.repository.url) {
              console.error("::error::packages/shell/package.json has no repository field - npm publish --provenance will be rejected (422)");
              process.exit(1);
            }
            console.log("repository: " + pkg.repository.url);
          '

      - name: Setup bun
        # prepack runs bun (build-client.mjs, verify-pack-locales.mjs); same
        # pin as ci.yml.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3 # root packageManager

      - name: Setup Node
        # npm does the version stamp and the publish; the bundle itself is
        # built by bun. packages/shell's engines (node >=26.4) describe the
        # runtime consumer, not this packaging run.
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies (frozen lockfile)
        # Whole workspace, not --filter: build-client.mjs imports
        # @opentui/solid out of packages/tui-base/node_modules.
        run: pnpm install --frozen-lockfile

      - name: stub @deepseek-ai/dsh-client-connection (no global dsh on runners)
        # Verbatim from ci.yml:30-41 — the SDK is not on the registry, and the
        # tests fake the connection, so a resolution-only stub is enough (it
        # throws if actually invoked).
        run: |
          node -e '
            const { mkdirSync, writeFileSync } = require("node:fs");
            const dir = "packages/shell/node_modules/@deepseek-ai/dsh-client-connection";
            mkdirSync(dir, { recursive: true });
            writeFileSync(dir + "/package.json",
              JSON.stringify({ type: "module", exports: { "./client": "./index.js" } }));
            writeFileSync(dir + "/index.js",
              "export const installConnection = () => { throw new Error(\"CI stub: @deepseek-ai/dsh-client-connection needs a global dsh install\"); };\n");
          '

      # Gate = the same named checks as ci.yml (ubuntu leg), in the same order
      # and with the same per-package cwd (bun reads bunfig.toml from the cwd
      # and only honors the [test] preload there). The macos matrix leg and the
      # opt-in real-client job stay in ci.yml: they need tmux, a global dsh and
      # a provider key, none of which exist on hosted runners.
      - name: Test suite (per package)
        run: for p in packages/*/; do (cd "$p" && bun test); done

      - name: Test tier ft (real renderer + real assembly)
        run: bun run test:ft

      - name: Typecheck the entry assembly chain
        run: cd packages/tui-base && bun run typecheck:entry

      - name: 'Assembly gates (verify: tests)'
        run: cd packages/tui-base && bun test -t '^verify:'

      - name: Stamp packages/shell/package.json to the tag version
        # The tag is the single source of truth (a small fix may skip the
        # version-bump commit: push, tag, release). build-client.mjs bakes this
        # version into the shipped bundle (__DSH_CLIENT_VERSION__) and prepack
        # rebuilds it during publish, so the stamp MUST precede the publish.
        run: |
          TAG_VERSION="${TAG#v}"
          [ -n "$TAG_VERSION" ] || { echo "::error::empty version in tag '$TAG'"; exit 1; }
          ( cd packages/shell && npm version "$TAG_VERSION" --allow-same-version --no-git-tag-version )
          echo "publishing $PKG@$TAG_VERSION (tag $TAG)"

      - name: Publish to npm
        working-directory: packages/shell
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm, not pnpm: prepack writes untracked files. Idempotent per the
        # template — an existing npm version is a skip (npm versions are
        # immutable), and npm's known lost-response failure (PUT lands, the
        # follow-up errors 403/404) is left to the verify step to decide.
        run: |
          TAG_VERSION="${TAG#v}"
          # Prerelease tags never move `latest`:
          # v1.2.3 -> latest · v1.2.3-rc.1 -> next.
          case "$TAG_VERSION" in
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac
          echo "npm dist-tag: $NPM_TAG"
          # Auth preflight. --registry is explicit because npm run from
          # packages/shell does not read the root .npmrc; auth still resolves
          # via setup-node's userconfig, which is cwd-independent.
          npm whoami --registry="$REG"
          if npm view "$PKG@$TAG_VERSION" version --registry="$REG" >/dev/null 2>&1; then
            echo "::warning::$PKG@$TAG_VERSION is already on npm — skipping publish"
            exit 0
          fi
          set +e
          PUB_OUT="$(npm publish --access public --provenance --tag "$NPM_TAG" --registry="$REG" 2>&1)"
          PUB_RC=$?
          set -e
          printf '%s\n' "$PUB_OUT"
          if [ "$PUB_RC" -ne 0 ] && printf '%s' "$PUB_OUT" | grep -qiE 'cannot publish over the previously published versions|E404|E403'; then
            echo "::warning::publish errored but may have landed (npm lost-response mode) — the verify step decides"
            exit 0
          fi
          exit "$PUB_RC"

      - name: Verify the publish actually landed
        # A zero exit from publish is not proof (npm has committed a write while
        # reporting failure). The registry answering with the exact version is
        # the acceptance signal; this also covers the already-published skip
        # path. Provenance publishes go through an async processing queue
        # ("Your package is being processed and may take a few minutes to become
        # available") that can take tens of minutes to become visible. Use a
        # 20-minute window with backoff so a slow-but-successful publish is not
        # reported as a false failure:
        #   0-2 min: every 10s  |  2-8 min: every 20s  |  8-20 min: every 60s
        # Keep this a hard gate — the registry is the only proof the package
        # landed; a genuine no-land must still turn the job red.
        run: |
          TAG_VERSION="${TAG#v}"
          START=$SECONDS
          ATTEMPT=0

          poll() {
            ATTEMPT=$((ATTEMPT + 1))
            SEEN="$(npm view "$PKG@$TAG_VERSION" version --registry="$REG" --prefer-online 2>/dev/null || true)"
            if [ "$SEEN" = "$TAG_VERSION" ]; then
              echo "verified: $PKG@$TAG_VERSION is on the registry (attempt $ATTEMPT, elapsed $((SECONDS - START))s)"
              return 0
            fi
            echo "attempt $ATTEMPT (elapsed $((SECONDS - START))s): registry answered '$SEEN'; waiting ${1}s for $TAG_VERSION"
            sleep "$1"
            return 1
          }

          # 0-2 min: 12 x 10s.
          for _ in $(seq 1 12); do poll 10 && exit 0; done
          # 2-8 min: 18 x 20s.
          for _ in $(seq 1 18); do poll 20 && exit 0; done
          # 8-20 min: 12 x 60s.
          for _ in $(seq 1 12); do poll 60 && exit 0; done

          # Timeout after 20 minutes: publish reported success but the version
          # never appeared on the registry. Keep this a hard failure.
          echo "::error::publish reported success but $PKG@$TAG_VERSION did not appear on the registry within 20 minutes"
          echo
          echo "The 'Publish to npm' step succeeded, but npm view never saw $TAG_VERSION on $REG."
          echo "Provenance publishes are processed asynchronously and can take tens of minutes to surface."
          echo
          echo "1. Check the registry directly (bypasses any local npm cache):"
          echo "   curl -sS \"https://registry.npmjs.org/@aiwayds%2Fdsh-opentui/${TAG_VERSION}\""
          echo "   Inspect dist-tags and versions[\"${TAG_VERSION}\"].dist.shasum in the response."
          echo "   The expected shasum is in the 'Publish to npm' step log, on the 'npm notice shasum:' line."
          echo
          echo "2. If the package is really there, this was only a propagation delay: do NOT re-tag the release."
          echo "   Re-run only the failed steps: gh run rerun ${GITHUB_RUN_ID} --failed"
          exit 1

  release:
    name: Create GitHub Release
    needs: publish # a failed publish blocks the release; re-run this job alone if only it failed
    if: github.repository == 'fan56/dsh-opentui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # gh has no git checkout here; -R below makes the repo explicit.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check if the Release already exists
        id: check
        # Idempotent: a re-run, a tag re-push, or a back-fill of an
        # already-published version must not fail on the existing Release.
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Release $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub Release
        if: steps.check.outputs.exists != 'true'
        run: |
          # Notes are generated from the commits/PRs since the previous tag.
          # A hyphenated tag is a prerelease and must not become "Latest".
          case "$TAG" in
            *-*) gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --prerelease ;;
            *)   gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes ;;
          esac
