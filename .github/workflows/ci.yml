name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - run: pnpm install --frozen-lockfile
      # CI has no global dsh: scripts/link-dsh-closure.mjs (postinstall) exits
      # 0 silently. @deepseek-ai/dsh-llm installs fine from npm (devDep,
      # 0.2.1-rc.5); only @deepseek-ai/dsh-client-connection is not on the
      # registry. Tests fake the connection (test/client-fakes.ts), so a
      # resolution-only stub suffices; it throws if actually invoked.
      - name: stub @deepseek-ai/dsh-client-connection (no global dsh on runners)
        run: |
          node -e '
            const { mkdirSync, writeFileSync } = require("node:fs");
            const dir = "packages/shell/node_modules/@deepseek-ai/dsh-client-connection";
            mkdirSync(dir, { recursive: true });
            writeFileSync(dir + "/package.json",
              JSON.stringify({ type: "module", exports: { "./client": "./index.js" } }));
            writeFileSync(dir + "/index.js",
              "export const installConnection = () => { throw new Error(\"CI stub: @deepseek-ai/dsh-client-connection needs a global dsh install\"); };\n");
          '
      # bun reads bunfig.toml from the cwd, and each package preloads the
      # opentui solid compiler there — run the suite per package, not at root.
      - run: for p in packages/*/; do (cd "$p" && bun test); done
      # Live interactive E2E (real dsh + real model turns): self-skips on
      # runners without a global dsh / installed profile; full suite on a
      # configured dev machine (npm run -w @aiwayds/dsh-opentui test:e2e).
      - run: node packages/shell/scripts/e2e-live.mjs && node packages/shell/scripts/e2e-fork.mjs
