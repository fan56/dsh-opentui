name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - run: pnpm install --frozen-lockfile
      # CI has no global dsh: scripts/link-dsh-closure.mjs (postinstall) exits
      # 0 silently and @deepseek-ai/* never resolve. Tests fake the SDK
      # (test/client-fakes.ts), so resolution-only stubs suffice; they throw
      # if actually invoked.
      - name: stub @deepseek-ai closure packages (no global dsh on runners)
        run: |
          node -e '
            const { mkdirSync, writeFileSync } = require("node:fs");
            const stubs = {
              "dsh-llm": { named: ["createUserMessage"] },
              "dsh-client-connection": { named: ["installConnection"], exports: { "./client": "./index.js" } },
            };
            for (const [name, cfg] of Object.entries(stubs)) {
              const dir = "packages/shell/node_modules/@deepseek-ai/" + name;
              mkdirSync(dir, { recursive: true });
              const pkgJson = { type: "module", ...(cfg.exports ? { exports: cfg.exports } : { main: "./index.js" }) };
              writeFileSync(dir + "/package.json", JSON.stringify(pkgJson));
              writeFileSync(dir + "/index.js", cfg.named.map((n) =>
                `export const ${n} = () => { throw new Error("CI stub: @deepseek-ai/${name} needs a global dsh install"); };`).join("\n") + "\n");
            }
          '
      # bun reads bunfig.toml from the cwd, and each package preloads the
      # opentui solid compiler there — run the suite per package, not at root.
      - run: for p in packages/*/; do (cd "$p" && bun test); done
      # Live interactive E2E (real dsh + real model turns): self-skips on
      # runners without a global dsh / installed profile; full suite on a
      # configured dev machine (npm run -w @aiwayds/dsh-opentui test:e2e).
      - run: node packages/shell/scripts/e2e-live.mjs && node packages/shell/scripts/e2e-fork.mjs
