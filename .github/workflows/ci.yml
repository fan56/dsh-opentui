name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 0.24 base integrity gate (delivery plan §二 v2.1): pure Node, no deps,
      # no host closure, no build. Byte-compares committed CapIR/capcontract
      # against the generators (catches hand-edited generated files) then runs
      # the static discipline checks, including the @manual wired-surface check
      # (RUN: hand-wired method-name set vs ledger registry, expected PASS).
      # release.yml is deliberately untouched.
      - name: CapIR / capcontract integrity gate
        run: node scripts/check-capcontract.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - run: pnpm install --frozen-lockfile
      # CI has no global dsh and there is no postinstall anymore (the retired
      # link-dsh-closure script was removed with the plugin-mode cutover).
      # @deepseek-ai/dsh-llm installs fine from npm (devDep, 0.2.2-rc.1);
      # only @deepseek-ai/dsh-client-connection is not on the registry.
      # Tests fake the connection (test/client-fakes.ts) and the transport
      # lazy-imports the SDK, so a resolution-only stub suffices; it throws
      # if actually invoked.
      - name: stub @deepseek-ai/dsh-client-connection (no global dsh on runners)
        run: |
          node -e '
            const { mkdirSync, writeFileSync } = require("node:fs");
            const dir = "packages/shell/node_modules/@deepseek-ai/dsh-client-connection";
            mkdirSync(dir, { recursive: true });
            writeFileSync(dir + "/package.json",
              JSON.stringify({ type: "module", exports: { "./client": "./index.js" } }));
            writeFileSync(dir + "/index.js",
              "export const installConnection = () => { throw new Error(\"CI stub: @deepseek-ai/dsh-client-connection needs a global dsh install\"); };\n");
          '
      # host-compat.test.ts spawns the real provisioner, which reads the built
      # dist/bridge artifact. dist/ is gitignored, so a fresh checkout has none;
      # without this build the host-gate tests fail on the artifact prerequisite
      # before they ever reach the host-version assertions. Same step the
      # pack-cold-start job uses.
      - name: Build bridge bundle
        run: bun scripts/build-bridge.mjs
      # bun reads bunfig.toml from the cwd, and bun test only honors the
      # [test] section's preload (the @opentui/solid real-runtime loader, see
      # each package's bunfig.toml) — run the suite per package, not at root.
      - run: for p in packages/*/; do (cd "$p" && bun test); done
      # TEST TIERS (docs/testing.md): ft = real renderer + real assembly
      # (testRender / @opentui/core/testing / `verify:` contracts), no network
      # and no tmux. The full-suite leg above already contains these files;
      # this step names the tier so a green run cannot hide an empty ft layer.
      # ui/e2e are deliberately NOT CI steps (no tmux, no global dsh/profile,
      # no provider key on hosted runners). Their absence here is not a pass —
      # see docs/testing.md §3.
      - run: bun run test:ft
      # ENTRY-CHAIN TYPECHECK (docs/verification-gates.md §2). This program
      # roots only the entry assembly chain (v2-entry + slash deps + the
      # deps/ctx declaration chain), NOT the package-wide budget: tui-base
      # still carries its historical errors, this leg owns zero.
      - run: cd packages/tui-base && bun run typecheck:entry
      # ASSEMBLY GATES (docs/verification-gates.md §1): tests named `verify:`
      # pin entry→host wiring and run without ~/.dsh, tmux or a provider key.
      # `^verify:` anchors to the test-name prefix so a renamed/garbled prefix
      # cannot silently widen the filter; this leg is a strict subset of the
      # full-suite leg above — it exists to name the assembly contract, not to
      # replace the full run.
      - run: cd packages/tui-base && bun test -t '^verify:'
      # The legacy HTTP client-topology E2E gate was retired with the HTTP
      # host. The release gate (fresh-install boot render check) covers the
      # real-boot leg before every publish. The retired plugin-face scripts
      # (e2e-live / e2e-fork) were removed with the plugin mode.
      # The real-machine tmux gate (verify/agents-mount-repro.mjs) is LOCAL
      # ONLY for GitHub-hosted runners: the published runner images do not
      # ship tmux, and the script needs a `dsh` CLI to run the real in-process
      # provisioner against its scratch HOME. See the conditional `real-client`
      # job below and docs/verification-gates.md §4.

  # Opt-in real-machine gate. Enable with the repository variable
  # DSH_REAL_CLIENT_GATE=true on a SELF-HOSTED runner labelled `dsh-profile`
  # that already has: global `dsh` on PATH and tmux installed. The gate runs the
  # real provisioner against a fresh scratch HOME and never reads ~/.dsh.
  # GitHub-hosted runners cannot satisfy that offline, so the job is skipped
  # by default — absence of evidence here is NOT a pass; the local run is
  # mandatory before merging keymap/panel/command-surface changes.
  #
  # SECURITY: never run this on a PR whose code comes from a fork. The gate
  # needs repo variable + a self-hosted runner with real credentials; a fork
  # PR could exfiltrate them. So the job is limited to workflow_dispatch or
  # same-repo pull requests (fork PRs get head.repo.full_name != repository).
  real-client:
    if: vars.DSH_REAL_CLIENT_GATE == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, dsh-profile]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - run: pnpm install --frozen-lockfile
      - name: stub @deepseek-ai/dsh-client-connection (same as the test job)
        run: |
          node -e '
            const { mkdirSync, writeFileSync } = require("node:fs");
            const dir = "packages/shell/node_modules/@deepseek-ai/dsh-client-connection";
            mkdirSync(dir, { recursive: true });
            writeFileSync(dir + "/package.json",
              JSON.stringify({ type: "module", exports: { "./client": "./index.js" } }));
            writeFileSync(dir + "/index.js",
              "export const installConnection = () => { throw new Error(\"CI stub: @deepseek-ai/dsh-client-connection needs a global dsh install\"); };\n");
          '
      # Fail fast with a named missing item. Without this, the test would
      # throw (DSH_AGENTS_E2E=1 makes a missing prerequisite a FAILURE, not a
      # skip) but the log would point at the test, not at the environment.
      - name: preflight (tmux, dsh)
        run: |
          missing=0
          command -v tmux >/dev/null 2>&1 || { echo "::error::tmux not found on PATH"; missing=1; }
          command -v dsh >/dev/null 2>&1 || { echo "::error::dsh not found on PATH"; missing=1; }
          exit "$missing"
      - name: real client tmux gate (/agents mount + slash palette)
        run: DSH_AGENTS_E2E=1 bun test test/agents-mount-client.test.ts
        working-directory: packages/shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-mount-captures
          path: verify/agents-mount-out/
          if-no-files-found: ignore

  # T8 — required packaging gate (ADR-0009 decision 5,
  # tickets/2026-11-18-inproc-bridge-plan.md). Proves the SHIPPED tarball, not
  # the checkout: npm pack -> install into a fresh prefix -> cold-start
  # provisioning -> bridge identity guard -> stdio ping handshake. No
  # continue-on-error, no cache reuse, no skip: every assertion is hard and
  # every failure dumps the tarball listing, the profile tree and the bridge's
  # stderr before going red.
  pack-cold-start:
    name: Pack / cold start / bridge handshake
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSH_OPENTUI_HOST_VERSION: 0.2.2-rc.3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26 # packages/shell engines: node >=26.4.0; this gate RUNS the installed CLI
          # Deliberately no `cache:` here — a cached store must not mask a cold-start failure.

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bridge bundle
        run: bun scripts/build-bridge.mjs

      # M2-2: the bridge inline guard is a pure content criterion. The bundle
      # FAILS only when it contains a host-implementation marker that Bun leaves
      # when it folds @deepseek-ai into the output: `function createUserMessage`,
      # `deepFreeze(`, or a `node_modules/.pnpm/@deepseek-ai` source banner.
      # The dsh-llm-outside-import check remains as the guard's narrow second
      # tier; since 0.24 the dsh-llm token in the bundle is the \u002f-escaped
      # form of CapIR capability data (see scripts/build-bridge.mjs, frozen by
      # 024 N1 C1), so this tier is expected to stay quiet — it no longer
      # generalises to other @deepseek-ai tokens.
      # Bundle size no longer decides the exit code — the current inlined
      # contract data puts the fixed build around ~230-240KB, above the old
      # 20480B ceiling — so 20480B is kept only as a reference threshold for a
      # warning line.
      - name: Assert bridge bundle does not inline host implementation
        shell: bash
        run: |
          set -eo pipefail
          BUNDLE="$GITHUB_WORKSPACE/packages/shell/dist/bridge/index.js"
          [ -f "$BUNDLE" ] || { echo "::error::built bridge bundle not found at $BUNDLE"; exit 1; }
          BYTES="$(wc -c < "$BUNDLE" | tr -d ' ')"
          echo "bridge bundle size: ${BYTES} bytes"
          if [ "$BYTES" -ge 20480 ]; then
            echo "::warning::bridge bundle is ${BYTES}B (>= 20480B reference threshold); size alone does not fail the gate"
          fi
          if grep -nE 'function createUserMessage|deepFreeze\(|node_modules/\.pnpm/@deepseek-ai' "$BUNDLE"; then
            echo "::error::bridge bundle contains inlined @deepseek-ai implementation markers"
            exit 1
          fi
          if grep -n '@deepseek-ai/dsh-llm' "$BUNDLE" | grep -Ev '^[0-9]+:[[:space:]]*import[[:space:]]'; then
            echo "::error::@deepseek-ai/dsh-llm appears outside an import statement"
            exit 1
          fi
          echo "bridge bundle inline guard PASS (${BYTES}B, no host implementation markers)"

      - name: Pack tarball (prepack must run)
        working-directory: packages/shell
        run: |
          # npm, not pnpm: prepack writes untracked build output that pnpm's
          # git-clean check rejects (same reason as release.yml). No
          # --ignore-scripts: prepack is the real publish build.
          TARBALL="$(npm pack | tail -n 1)"
          [ -n "$TARBALL" ] && [ -f "$TARBALL" ] || { echo "::error::npm pack produced no tarball"; exit 1; }
          echo "TARBALL=$GITHUB_WORKSPACE/packages/shell/$TARBALL" >> "$GITHUB_ENV"
          echo "packed $TARBALL"

      - name: Assert tarball / fresh install / cold start / handshake
        shell: bash
        run: |
          set -eo pipefail

          WORK="$(mktemp -d)"
          PREFIX="$RUNNER_TEMP/dsh-opentui-prefix"
          HOST_PREFIX="$RUNNER_TEMP/dsh-opentui-host-prefix"
          FRESH_DSH_HOME="$WORK/dsh-home"
          PROFILE_DIR=""
          REPAIR_OUT="$WORK/repair.out"
          HANDSHAKE_OUT="$WORK/handshake.out"
          HANDSHAKE_ERR="$WORK/handshake.err"

          dump_diagnostics() {
            echo "===== T8 DIAGNOSTICS ====="
            echo "--- tarball file list ---"
            if [ -n "${TARBALL:-}" ] && [ -f "$TARBALL" ]; then tar -tf "$TARBALL"; else echo "(no tarball at ${TARBALL:-unset})"; fi
            echo "--- profile tree ---"
            if [ -d "$PROFILE_DIR" ]; then find "$PROFILE_DIR" -maxdepth 6 -print; else echo "(no profile dir)"; fi
            echo "--- bridge repair stdout/stderr ---"
            if [ -f "$REPAIR_OUT" ]; then cat "$REPAIR_OUT"; else echo "(no repair output)"; fi
            echo "--- bridge handshake stdout ---"
            if [ -f "$HANDSHAKE_OUT" ]; then cat "$HANDSHAKE_OUT"; else echo "(no handshake stdout)"; fi
            echo "--- bridge handshake stderr ---"
            if [ -f "$HANDSHAKE_ERR" ]; then cat "$HANDSHAKE_ERR"; else echo "(no handshake stderr)"; fi
            echo "=========================="
          }
          fail() { echo "::error::$1"; dump_diagnostics; exit 1; }
          # Any unexpected nonzero exit also gets the context dump.
          trap 'echo "::error::unexpected failure at line $LINENO (rc=$?)"; dump_diagnostics' ERR

          mkdir -p "$FRESH_DSH_HOME" || fail "cannot create fresh DSH_HOME at $FRESH_DSH_HOME"

          # 3. tarball content assertions.
          TAR_LIST="$WORK/tar-list.txt"
          # Guard tar itself: with `set -e` a bare failing pipe would exit
          # before fail() gets a chance to dump the diagnostics.
          if ! tar -tf "$TARBALL" | sort > "$TAR_LIST"; then
            fail "cannot list tarball $TARBALL"
          fi
          for f in \
            package/dist/bridge/index.js \
            package/dist/bridge/package.json \
            package/dist/bridge/cordis.patch.yml \
            package/dist/bridge/bundle-fingerprint.json
          do
            grep -Fxq "$f" "$TAR_LIST" || fail "tarball is missing $f"
          done
          if grep -q 'node_modules/@deepseek-ai/' "$TAR_LIST"; then
            fail "tarball contains a forbidden node_modules/@deepseek-ai/ entry"
          fi
          echo "tarball bridge entries:"
          grep '^package/dist/bridge/' "$TAR_LIST"

          # 4. fresh-prefix installs: no workspace symlink can take part, and
          # the host is pinned to the bridge's peer version (not on hosted
          # runners). A failed host install is a real failure, never a skip.
          npm i -g --prefix "$PREFIX" "$TARBALL" || fail "fresh-prefix install of the tarball failed"
          npm i -g --prefix "$HOST_PREFIX" "@deepseek-ai/dsh@$DSH_OPENTUI_HOST_VERSION" \
            || fail "pinned host install (@deepseek-ai/dsh@$DSH_OPENTUI_HOST_VERSION) failed"
          DSH_BIN="$HOST_PREFIX/bin/dsh"
          [ -x "$DSH_BIN" ] || fail "installed dsh binary not found at $DSH_BIN"
          PROFILE_NAME="$(node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            const { DEFAULT_PROFILE } = await import(pathToFileURL(process.argv[1]).href);
            if (typeof DEFAULT_PROFILE !== "string" || !DEFAULT_PROFILE) process.exit(1);
            process.stdout.write(DEFAULT_PROFILE);
          ' "$PREFIX/lib/node_modules/@aiwayds/dsh-opentui/scripts/lib/profile-name.mjs")" \
            || fail "installed package did not export a valid DEFAULT_PROFILE"
          PROFILE_DIR="$FRESH_DSH_HOME/profiles/$PROFILE_NAME"

          # 5. cold start (headless): provisioning + T5 identity + T7 repair.
          set +e
          DSH_HOME="$FRESH_DSH_HOME" "$PREFIX/bin/dsh-opentui" --repair-bridge > "$REPAIR_OUT" 2>&1
          REPAIR_RC=$?
          set -e
          cat "$REPAIR_OUT"
          [ "$REPAIR_RC" -eq 0 ] || fail "--repair-bridge exited $REPAIR_RC"
          grep -q 'bridge identity OK' "$REPAIR_OUT" || fail "--repair-bridge output has no 'bridge identity OK'"
          grep -q 'PASS' "$REPAIR_OUT" || fail "--repair-bridge output has no PASS"

          # 6. stdio handshake through the INSTALLED dsh (not the checkout).
          set +e
          node "$GITHUB_WORKSPACE/scripts/verify-bridge-handshake.mjs" "$DSH_BIN" "$FRESH_DSH_HOME" 25000 \
            > "$HANDSHAKE_OUT" 2> "$HANDSHAKE_ERR"
          HANDSHAKE_RC=$?
          set -e
          cat "$HANDSHAKE_OUT"
          cat "$HANDSHAKE_ERR" >&2
          [ "$HANDSHAKE_RC" -eq 0 ] || fail "bridge handshake exited $HANDSHAKE_RC"
          grep -Eq '"protocolVersion"[[:space:]]*:[[:space:]]*1' "$HANDSHAKE_OUT" \
            || fail "handshake stdout has no protocolVersion:1"

          # 7. the profile must never hold a @deepseek-ai copy (empty find).
          DS_COPY="$(find "$PROFILE_DIR" -path '*@deepseek-ai*' -print 2>/dev/null || true)"
          echo "profile @deepseek-ai find output: ${DS_COPY:-<empty>}"
          [ -z "$DS_COPY" ] || fail "profile contains @deepseek-ai copies: $DS_COPY"
          echo "T8 pack / cold start / handshake gate PASS"

      - name: Fresh-home verifier pass 1 (negative only; no dsh or host pin)
        shell: bash
        run: |
          set -eo pipefail
          NODE_DIR="$(dirname "$(command -v node)")"
          SYSTEM_PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$NODE_DIR"
          if env PATH="$SYSTEM_PATH" bash -c 'command -v dsh >/dev/null 2>&1'; then
            echo "::error::pass 1 PATH unexpectedly contains dsh"
            exit 1
          fi
          PASS1_HOME="$RUNNER_TEMP/fresh-home-pass1-home"
          REPORT="$RUNNER_TEMP/fresh-home-no-dsh.json"
          mkdir -p "$PASS1_HOME"
          set +e
          env -u DSH_OPENTUI_HOST_VERSION -u DSH_HOME \
            HOME="$PASS1_HOME" PATH="$SYSTEM_PATH" \
            node "$GITHUB_WORKSPACE/scripts/verify-fresh-home-provision.mjs" \
              --prefix "$RUNNER_TEMP/dsh-opentui-prefix" --scenario=no-dsh --json > "$REPORT"
          VERIFIER_RC=$?
          set -e
          node - "$REPORT" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const required = [
            'negative:no-dsh:exit-nonzero',
            'negative:no-dsh:fail-fast-trio',
            'negative:no-dsh:no-profile-artifacts',
          ]
          const bad = required.filter((name) => report.checks.find((check) => check.name === name)?.status !== 'PASS')
          const notRun = Object.entries(report.scenarioStatus ?? {})
            .filter(([name, status]) => name !== 'no-dsh' && status !== 'NOT RUN')
            .map(([name]) => name)
          if (report.scenario !== 'no-dsh' || report.result !== 'PASS'
              || Object.keys(report.scenarios).join(',') !== 'noDsh' || bad.length > 0 || notRun.length > 0) {
            console.error(`pass 1 assertion failed: ${bad.join(', ') || 'unexpected report status'}; unexpected scenarios: ${notRun.join(', ')}`)
            process.exit(1)
          }
          console.log(`pass 1 PASS: ${required.length} negative:no-dsh assertions PASS; all other scenarios NOT RUN`)
          NODE
          [ "$VERIFIER_RC" -eq 0 ] || { echo "::error::pass 1 verifier exited $VERIFIER_RC"; exit "$VERIFIER_RC"; }
          echo "pass 1 JSON report: $REPORT"

      - name: Fresh-home verifier pass 2 (scoped dsh + host pin; all scenarios)
        shell: bash
        run: |
          set -eo pipefail
          NODE_DIR="$(dirname "$(command -v node)")"
          SYSTEM_PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$NODE_DIR"
          DSH_BIN="$RUNNER_TEMP/dsh-opentui-host-prefix/bin/dsh"
          PASS2_PATH="$(dirname "$DSH_BIN")"
          # pnpm/action-setup installs pnpm under PNPM_HOME, which is NOT on the
          # system PATH, and the provisioner shells out to `pnpm` to install the
          # policy companions. Keep the PATH scoped: add only that one pnpm dir.
          # If PNPM_HOME is unset/empty, fall back to the original dsh + system-only PATH.
          if [ -n "${PNPM_HOME:-}" ]; then
            PASS2_PATH="$PASS2_PATH:$PNPM_HOME"
          fi
          PASS2_PATH="$PASS2_PATH:$SYSTEM_PATH"
          RESOLVED_DSH="$(env PATH="$PASS2_PATH" bash -c 'command -v dsh')"
          [ "$RESOLVED_DSH" = "$DSH_BIN" ] || { echo "::error::pass 2 resolved $RESOLVED_DSH, expected $DSH_BIN"; exit 1; }
          PASS2_HOME="$RUNNER_TEMP/fresh-home-pass2-home"
          REPORT="$RUNNER_TEMP/fresh-home-all.json"
          mkdir -p "$PASS2_HOME"
          set +e
          env -u DSH_HOME HOME="$PASS2_HOME" PATH="$PASS2_PATH" \
            DSH_OPENTUI_HOST_VERSION="$DSH_OPENTUI_HOST_VERSION" \
            node "$GITHUB_WORKSPACE/scripts/verify-fresh-home-provision.mjs" \
              --prefix "$RUNNER_TEMP/dsh-opentui-prefix" --with-dsh "$DSH_BIN" \
              --scenario=all --json > "$REPORT"
          VERIFIER_RC=$?
          set -e
          node - "$REPORT" <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const required = [
            'positive:exit0',
            'profile:exists',
            'companions:desired',
            'companions:manifest-exact',
            'companions:ondisk-exact',
          ]
          const bad = required.filter((name) => report.checks.find((check) => check.name === name)?.status !== 'PASS')
          if (report.scenario !== 'all' || report.result !== 'PASS'
              || report.scenarioStatus?.positive !== 'PASS'
              || report.desiredCompanionIds?.length !== 11 || report.desiredCompanions?.length !== 11
              || bad.length > 0) {
            console.error(`pass 2 assertion failed: ${bad.join(', ') || 'positive scenario or 11-companion contract missing'}`)
            process.exit(1)
          }
          const notRun = report.checks.filter((check) => check.status === 'NOT RUN')
          console.log(`pass 2 PASS: positive scenario installed all 11 policy companions; ${notRun.length} NOT RUN check(s)`)
          if (notRun.length === 0) console.log('NOT RUN <none>')
          for (const check of notRun) {
            console.log(`NOT RUN ${check.name}${check.detail ? ` — ${check.detail}` : ''}`)
          }
          NODE
          [ "$VERIFIER_RC" -eq 0 ] || { echo "::error::pass 2 verifier exited $VERIFIER_RC"; exit "$VERIFIER_RC"; }
          echo "pass 2 JSON report: $REPORT"

      - name: Upload fresh-home verifier JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-home-provision-reports
          path: |
            ${{ runner.temp }}/fresh-home-no-dsh.json
            ${{ runner.temp }}/fresh-home-all.json
          if-no-files-found: ignore

